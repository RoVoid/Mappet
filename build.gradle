buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:5.1.73'
        classpath "org.apache.maven.plugins:maven-resources-plugin:3.2.0"
        classpath 'gradle.plugin.com.github.johnrengelman:shadow:7.1.2'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'com.github.johnrengelman.shadow'

group = "mchorse.mappet"
version = property('version')

base {
    archivesName.set("Mappet")
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    accessTransformer = file('src/main/resources/META-INF/mappet_at.cfg')

    runs {
        client {
            workingDirectory project.file("run")
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
            args '--username', 'Dev'
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2859'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly files("run/libs/blockbuster-${blockbuster}.jar")
    compileOnly files("run/libs/metamorph-${metamorph}.jar")
    compileOnly files("run/libs/mclib-${mclib}.jar")
    compileOnly files("run/libs/aperture-${aperture}.jar")
    compileOnly files("run/libs/chameleon-${chameleon}.jar")
    compileOnly files("run/libs/nashorn.jar")

    implementation 'org.reflections:reflections:0.9.12'
    implementation 'org.slf4j:slf4j-api:1.7.32'
    implementation 'org.javassist:javassist:3.28.0-GA'

    implementation('org.ow2.asm:asm:5.2') { force = true }
    implementation('org.ow2.asm:asm-tree:5.2') { force = true }
    implementation('org.ow2.asm:asm-util:5.2') { force = true }

    implementation("net.minecraftforge:mergetool:0.2.3.3") { force = true }
}

import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import org.apache.tools.ant.filters.ReplaceTokens

import java.time.LocalDate
import java.time.format.DateTimeFormatter

// Token replacement
tasks.register('processSource', Sync) {
    outputs.upToDateWhen { false }
    from sourceSets.main.java
    filter(ReplaceTokens, tokens: [MAPPET     : version,
                                   MCLIB      : mclib,
                                   METAMORPH  : metamorph,
                                   BLOCKBUSTER: blockbuster,
                                   APERTURE   : aperture,
                                   CHAMELEON  : chameleon])
    into layout.buildDirectory.dir("generated-src")
}

tasks.named('compileJava', JavaCompile).configure {
    source = tasks.named('processSource').get().outputs
}

tasks.named('shadowJar').configure {
    archiveClassifier.set("")

    dependencies {
        include(dependency("org.reflections:reflections:0.9.12"))
        include(dependency("org.slf4j:slf4j-api:1.7.32"))
        include(dependency("org.javassist:javassist:3.28.0-GA"))
    }


    relocate "org.reflections", "mchorse.mappet.libs.org.reflections"
    relocate "org.slf4j", "mchorse.mappet.libs.org.slf4j"
    relocate "javassist", "mchorse.mappet.libs.javassist"

    if (providers.environmentVariable("export").isPresent()) {
        finalizedBy('moveToExportFolder')
    }
}

tasks.register('moveToExportFolder', Copy) {
    from layout.buildDirectory.file("libs/Mappet-${project.version}.jar")
    into project.file("exports")
    doLast {
        layout.buildDirectory.file("libs/Mappet-${project.version}.jar").get().asFile.delete()
    }
}

jar.finalizedBy('shadowJar')
jar.finalizedBy('reobfJar')

// Assets
tasks.register('prepareAssets', Copy) {
    group = 'build'
    inputs.property 'version', version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand(project.properties)
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }

    into layout.buildDirectory.dir("classes/java/main")
}

tasks.named('classes').configure {
    dependsOn('prepareAssets')
}

// Lang tools
tasks.register('compareLangFiles') {
    doLast {
        def help = project.file("src/main/resources/assets/${base.archivesName.get().toLowerCase()}/lang/")
        def parse = { File file ->
            def map = new HashMap()
            file.text.split("\n").each { split ->
                def index = split.indexOf("=")
                if (index != -1) map.put(split.substring(0, index), true)
            }
            return map
        }

        if (!help.exists()) return

        def en = project.file("${help.absolutePath}/en_US.lang")
        def en_map = parse(en)

        help.listFiles().each { lang_file ->
            if (!lang_file.name.endsWith(".lang") || lang_file.name.startsWith("en_US")) return

            def lang_map = parse(lang_file)
            def missing = en_map.keySet().findAll { !lang_map.containsKey(it) }.sort()
            def extra = lang_map.keySet().findAll { !en_map.containsKey(it) }.sort()

            print("\n")
            if (!missing.isEmpty() || !extra.isEmpty()) {
                if (!missing.isEmpty()) {
                    print("${lang_file.name} misses:\n"); missing.each { print("- ${it}\n") }
                }
                if (!extra.isEmpty()) {
                    print("${lang_file.name} has extra:\n"); extra.each { print("- ${it}\n") }
                }
            } else {
                print("${lang_file.name} fully matches ${en.name}!\n")
            }
        }
    }
}

tasks.register('copyLangStrings') {
    doLast {
        def parse = { File file ->
            def map = new HashMap()
            file.text.split("\n").each { split ->
                def index = split.indexOf("=")
                if (index != -1) map.put(split.substring(0, index), split.substring(index + 1))
            }
            return map
        }

        def help = project.file("src/main/resources/assets/${base.archivesName.get().toLowerCase()}/lang/")
        def en = project.file("${help.absolutePath}/en_US.lang")

        help.listFiles().each { file ->
            if (!file.name.endsWith(".lang") || file.name.startsWith("en_")) return

            def strings = parse(file)
            def splits = en.text.split("\n")

            splits.eachWithIndex { str, i ->
                if (str.contains("=")) {
                    def key = str.substring(0, str.indexOf("="))
                    if (strings.containsKey(key)) splits[i] = key + "=" + strings.get(key)
                }
            }

            file.write(splits.join("\n"))
            print("Wrote to ${file.name}...\n")
        }

        print("Done!")
    }
}

// Javadocs
tasks.register('scriptingJavadocsJson', Exec) {
    group = "build"
    ignoreExitValue = true

    def deps = configurations.runtimeClasspath.collect { it.absolutePath }.join(File.pathSeparator)

    executable "javadoc"
    args "-doclet", "robot.utils.doclets.JsonDoclet",
            "-docletpath", "./run/jsonDoclet-1.2.jar",
            "-sourcepath", "./src/main/java/",
            "-classpath", "./run/libs/*${File.pathSeparator}${deps}",
            "-encoding", "UTF-8",
            "-subpackages", "mchorse.mappet.api.scripts.code",
            "-root", "mchorse.mappet.api.scripts.code",
            "-result", "./src/main/resources/assets/mappet/docs",
            "-version", "3"

    errorOutput = System.err
    standardOutput = System.out
}

// Icons
def iconsDir = file("src/main/resources/assets/mappet/textures/gui/icons")
def iconsJson = file("src/main/resources/assets/mappet/icons.json")

tasks.register('generateIconsJson') {
    group = "build"
    inputs.dir(iconsDir)
    outputs.file(iconsJson)

    doLast {
        def iconsList = []

        if (iconsDir.exists()) {
            iconsDir.eachFileRecurse { file ->
                if (!file.isFile() || !file.name.endsWith(".png")) return
                def relativePath = iconsDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                if (relativePath[0] == '-') return
                def iconKey = relativePath.substring(0, relativePath.length() - 4)
                def jsonSibling = new File(file.parentFile, file.name.replace(".png", ".json"))

                if (jsonSibling.exists()) {
                    def parsed = new JsonSlurper().parse(jsonSibling)
                    if (parsed instanceof Map) {
                        parsed["path"] = iconKey; iconsList << parsed
                    } else iconsList << iconKey
                } else {
                    iconsList << iconKey
                }
            }
        }

        iconsList.sort { a, b -> ((a instanceof Map ? a["path"] : a) as String) <=> ((b instanceof Map ? b["path"] : b) as String) }

        iconsJson.parentFile.mkdirs()
        iconsJson.text = JsonOutput.prettyPrint(JsonOutput.toJson(iconsList))
    }
}

def iconSiblingJsonExcludes = fileTree(iconsDir) {
    include "**/*.json"
}.filter { File file -> new File(file.parentFile, file.name.replace(".json", ".png")).exists()
}.collect { File file -> "assets/mappet/textures/gui/icons/" + iconsDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
}

//tasks.named('processResources').configure {
//    dependsOn('scriptingJavadocsJson')
//    dependsOn('generateIconsJson')
//}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude iconSiblingJsonExcludes
}

// Sources archive
tasks.register('archiveSources', Exec) {
    def date = LocalDate.now().format(DateTimeFormatter.ofPattern("yyyy-MM-dd"))
    commandLine("7z", "a", "-t7z", "-mx9", file("exports/mappet-${date}.7z").absolutePath, "mchorse")
    workingDir file("src/main/java")
}